/* Live integration shell */
body.auth-pending .sidebar, body.auth-pending .topbar { display:none !important; }
body.auth-pending .app { display:block; min-height:100vh; }
body.auth-pending .main { min-height:100vh; }
body.auth-pending .content { padding:0 !important; margin:0 !important; }
body.auth-pending #legacyPane { position:fixed; inset:0; z-index:1000; height:100vh; border:0; border-radius:0; }
body.auth-pending #legacyFrame { position:absolute; inset:0; width:100%; height:100%; border:0; }
.content.legacy-content { padding:16px 18px 18px; overflow:hidden; }
#legacyPane { position:relative; width:100%; height:calc(100vh - 105px); min-height:520px; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--panel); box-shadow:var(--shadow); }
#legacyFrame { display:block; width:100%; height:100%; border:0; background:#0b1020; }
.connectiontop .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#fbbf24; box-shadow:0 0 0 4px #fbbf2418; }
body.authenticated .connectiontop .dot { background:#45d6bd; box-shadow:0 0 0 4px #45d6bd18; }
.quickmenu { position:fixed; z-index:80; right:24px; top:72px; width:220px; padding:7px; border:1px solid var(--line); border-radius:15px; background:var(--panel); box-shadow:var(--shadow); display:none; }
.quickmenu.open { display:grid; gap:4px; }
.quickmenu button { border:0; border-radius:10px; padding:10px 12px; text-align:left; background:transparent; color:var(--text); }
.quickmenu button:hover { background:#ffffff12; }
.shell-toast { position:fixed; bottom:20px; right:22px; z-index:120; border:1px solid var(--line); border-radius:13px; padding:11px 15px; background:var(--panel2); color:var(--text); box-shadow:var(--shadow); opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; }
.shell-toast.show { opacity:1; transform:translateY(0); }

}

<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobilemenu" id="mobilemenu" aria-label="Open menu">☰</button><div class="crumb">Workspace <strong id="crumb">Overview</strong></div></div>
  <div class="topactions"><div class="search"><button type="button" id="searchGo" class="searchgo" aria-label="Search" title="Search (press /)">⌕</button><input id="globalSearch" type="search" placeholder="Search products…  ( / )" autocomplete="off" aria-label="Search products" /></div><select class="select" id="storeSelect" aria-label="Store"><option>All stores</option><option>Warda</option><option>Amani</option><option>Afiya Noor</option><option>Warda 2</option></select><button class="iconbtn" id="notifyBtn" title="Smart alerts &amp; recommendations" aria-label="Smart alerts">♧</button><button class="primarybtn" id="quickAdd" aria-haspopup="true" aria-expanded="false">＋ Quick action</button></div>
</header>
<div class="content legacy-content">
  <div id="legacyPane" aria-label="Stock Book live workspace">
    <iframe id="legacyFrame" title="Stock Book operational workspace" src="/legacy-app.html" loading="eager" allow="clipboard-read; clipboard-write"></iframe>
  </div>
</div>
</main>
</div>
<div class="loaderr" id="loadError" role="alert"><div class="loaderr-box"><b>Stock Book could not finish loading</b><p id="loadErrorText"></p><button type="button" class="primarybtn" id="loadReload">Try again</button></div></div>
<div class="quickmenu" id="quickMenu" role="menu" aria-label="Quick actions">
  <button type="button" data-action="sale">↗ &nbsp; New sale</button>
  <button type="button" data-action="import">⇧ &nbsp; New import</button>
  <button type="button" data-action="transfer">⇄ &nbsp; New transfer</button>
  <button type="button" data-action="writeoff">⊖ &nbsp; New write-off</button>
</div>
<div class="shell-toast" id="shellToast" role="status" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const frame = $('legacyFrame');
  const labels = {overview:'Overview',catalog:'Product catalog',sales:'Sales & returns',imports:'Imports',transfers:'Transfers',writeoffs:'Write-offs',intelligence:'Smart Retail Intelligence',analytics:'Management analytics',reports:'Daily reports',sync:'BILLZ synchronization',telegram:'Telegram Mini App',settings:'Settings'};
  const appViews = Object.keys(labels).filter(v=>v!=='telegram'&&v!=='settings');
  const storeMap = {'All stores':'','Warda':'Warda','Amani':'Amani','Afiya Noor':'Afiya noor','Warda 2':'Warda 2'};
  const BOT_URL = 'https://t.me/wardareport2026_bot';
  let activeView = 'overview', observer = null, authCheck = null, toastTimer = null, frameLoadedAt = 0, bootWaitStart = Date.now();
  const pending = [];            // actions requested before the app finished loading
  let searchTimer = null;

  function toast(message){
    const el=$('shellToast'); if(!el)return;
    el.textContent=message; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
  }
  function doc(){try{return frame.contentDocument || frame.contentWindow.document;}catch(_){return null;}}
  function bridge(){try{const b=frame.contentWindow.StockBookBridge;return b&&b.ready&&b.ready()?b:null;}catch(_){return null;}}
  function bridgeAny(){try{return frame.contentWindow.StockBookBridge||null;}catch(_){return null;}}

  /* ---------- skin the embedded app ---------- */
  function applyLegacySkin(){
    const d=doc(); if(!d || !d.head || d.getElementById('stockbook-shell-skin'))return;
    const style=d.createElement('style'); style.id='stockbook-shell-skin';
    style.textContent = `
      :root,html[data-theme="indigo"],html:not([data-theme]){--bg:#0b1020;--side:#111a32;--card:#111a32;--row:#172241;--c2:#202d56;--tx:#f4f7ff;--mu:#9ca9cc;--bd:rgba(162,180,231,.18);--ac:#45d6bd;--on:#071827;--ok:#82e6a8;--okbg:#173b37;--bad:#ff8294;--s2:#72a7ff;--s3:#82e6a8;--s4:#ffbd76;--s5:#a78bfa;color-scheme:dark}
      html,body{background:#0b1020!important;color:#f4f7ff!important;min-height:100%;}
      body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif!important}
      #side{display:none!important}
      body.in #wrap{margin:0!important;max-width:none!important;width:auto!important;padding:12px 14px 22px!important}
      body.in main{max-width:none!important;margin:0!important;width:100%!important}
      body.in main::before{display:none!important}
      #app{width:100%!important;min-width:0!important}
      #app>section{min-width:0}
      #app>section>.ph1{border-radius:16px!important}
      #app .card{border-radius:16px!important}
      #fly{left:auto!important;right:12px!important;bottom:12px!important;z-index:99!important}
      #dlg,#pnl,#tip{z-index:110!important}
      input,select,textarea{max-width:100%}
      @media(max-width:760px){body.in #wrap{padding:8px!important}h1{font-size:24px!important}}
    `;
    d.head.appendChild(style);
  }

  /* ---------- auth / connection state ---------- */
  function setConn(text,desc,state){
    $('connectionText').textContent=text; $('connectionDescription').textContent=desc;
    $('connectionDot').className='dot '+(state||'');
  }
  function inspectAuth(){
    const d=doc(); if(!d)return;
    applyLegacySkin();
    const app=d.getElementById('app'), login=d.getElementById('login');
    if(!app || !login)return;
    const ready=!app.hidden && login.hidden;
    document.body.classList.toggle('authenticated',ready);
    document.body.classList.toggle('auth-pending',!ready);
    if(!navigator.onLine){ setConn('Offline','No internet connection. Changes cannot be saved until you are back online.','bad'); }
    else if(ready){
      setConn('Signed-in workspace','Firebase records and Stock Book services are available.','');
      const b=bridgeAny();
      if(b){ try{const who=b.identity(); if(who){$('shellIdentity').textContent=who;$('shellAvatar').textContent=who.slice(0,2).toUpperCase();}}catch(_){} }
    }else{
      setConn('Sign in required','Use your existing Stock Book account to continue.','warn');
    }
    if(ready){ hideLoadError(); flushPending(); syncNavFromApp(); }
    else if(window.__shellBootErr===undefined){ checkBootError(d); }
  }
  function checkBootError(d){
    try{
      const w=frame.contentWindow;
      if(w && w.__sbBootError){ window.__shellBootErr=w.__sbBootError; }
    }catch(_){}
  }

  /* keep the sidebar highlight correct even when the app navigates by itself */
  function syncNavFromApp(){
    const b=bridgeAny(); if(!b||!b.current)return;
    let v; try{v=b.current();}catch(_){return}
    if(v && v!==activeView && activeView!=='settings' && activeView!=='telegram'){ setNav(v,true); }
  }

  function onFrameReady(){
    frameLoadedAt=Date.now();
    applyLegacySkin(); inspectAuth();
    const d=doc();
    if(d && d.documentElement && window.MutationObserver){
      if(observer)observer.disconnect();
      observer=new MutationObserver(inspectAuth);
      observer.observe(d.documentElement,{subtree:true,attributes:true,attributeFilter:['hidden','class']});
    }
    if(authCheck)clearInterval(authCheck);
    authCheck=setInterval(inspectAuth,800);
  }

  /* ---------- load-failure panel (instead of silently dead buttons) ---------- */
  function showLoadError(msg){
    const box=$('loadError'); if(!box)return;
    $('loadErrorText').textContent=msg; box.classList.add('show');
  }
  function hideLoadError(){const box=$('loadError'); if(box)box.classList.remove('show');}
  setInterval(()=>{
    if(document.body.classList.contains('authenticated'))return;
    const w=(()=>{try{return frame.contentWindow}catch(_){return null}})();
    if(w && w.__sbBootError){ showLoadError(w.__sbBootError); return; }
    if(Date.now()-bootWaitStart>25000 && !bridgeAny()){
      showLoadError('Stock Book is taking too long to start. Check your connection or disable ad-blockers/VPN for this site, then reload.');
    }
  },2000);
  $('loadReload').addEventListener('click',()=>{hideLoadError();bootWaitStart=Date.now();frame.src='/legacy-app.html?r='+Date.now();});

  /* ---------- navigation ---------- */
  function setNav(view,silent){
    activeView=view;
    document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
    $('crumb').textContent=labels[view]||view;
    closeSidebar();
    if(!silent && appViews.indexOf(view)>=0){ try{ history.replaceState(null,'','#'+view); }catch(_){ } }
    document.title=(labels[view]||'Stock Book')+' — Stock Book';
  }
  function closeSidebar(){ $('sidebar').classList.remove('open'); $('sidebarBackdrop').classList.remove('show'); }
  function flushPending(){
    if(!pending.length||!bridge())return;
    const jobs=pending.splice(0); jobs.forEach(j=>{try{j()}catch(e){console.warn(e)}});
  }
  function whenReady(job,label){
    if(bridge()){ job(); return true; }
    pending.push(job);
    toast(document.body.classList.contains('authenticated')?'Loading… your action will run in a moment.':'Please sign in first — your action will run afterwards.');
    return false;
  }

  function navigate(view){
    if(view==='telegram'){
      setNav('telegram');
      window.open(BOT_URL,'_blank','noopener');
      toast('Open the bot and tap Dashboard to launch the Mini App.');
      setTimeout(()=>setNav(bridgeAny()&&bridgeAny().current?bridgeAny().current():'overview',true),600);
      return;
    }
    const run=()=>{
      const b=bridge();
      if(view==='settings'){
        b.navigate('overview'); setNav('settings',true);
        setTimeout(()=>{const x=bridge();if(x&&!x.settings())toast('Settings are not available.');},80);
        return;
      }
      if(!b.navigate(view)){toast('This section is not available.');return;}
      setNav(view);
    };
    setNav(view,true);       // instant visual feedback
    whenReady(run);
  }

  document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.view)));
  document.querySelectorAll('[data-goto]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.goto)));
  $('mobilemenu').addEventListener('click',()=>{const o=$('sidebar').classList.toggle('open');$('sidebarBackdrop').classList.toggle('show',o);});
  $('sidebarBackdrop').addEventListener('click',closeSidebar);
  $('notifyBtn').addEventListener('click',()=>navigate('intelligence'));

  /* ---------- quick actions ---------- */
  function closeQuick(){$('quickMenu').classList.remove('open');$('quickAdd').setAttribute('aria-expanded','false');}
  $('quickAdd').addEventListener('click',e=>{e.stopPropagation();const o=$('quickMenu').classList.toggle('open');$('quickAdd').setAttribute('aria-expanded',String(o));});
  $('quickMenu').addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;
    const act=b.dataset.action; closeQuick();
    const v=act==='sale'?'sales':act==='import'?'imports':act==='transfer'?'transfers':'writeoffs';
    whenReady(()=>{const x=bridge(); if(x.quick(act)) setNav(v,true); else toast('That action is not available.');});
  });
  document.addEventListener('click',e=>{if(!e.target.closest('#quickAdd')&&!e.target.closest('#quickMenu'))closeQuick()});

  /* ---------- search (live + Enter + button) ---------- */
  function runSearch(q){
    q=(q||'').trim();
    whenReady(()=>{const x=bridge(); x.search(q); setNav('catalog');});
  }
  $('globalSearch').addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();clearTimeout(searchTimer);const q=e.target.value.trim();if(q)runSearch(q);}
    if(e.key==='Escape'){e.target.value='';e.target.blur();}
  });
  $('globalSearch').addEventListener('input',e=>{
    clearTimeout(searchTimer);const q=e.target.value;
    if(q.trim().length<2)return;
    searchTimer=setTimeout(()=>{if(bridge())runSearch(q)},450);
  });
  $('searchGo').addEventListener('click',()=>{const q=$('globalSearch').value.trim();if(q)runSearch(q);else $('globalSearch').focus();});

  $('storeSelect').addEventListener('change',e=>{
    whenReady(()=>{const x=bridge();x.setStore(storeMap[e.target.value]??'');toast('Store filter: '+e.target.value);});
  });

  /* ---------- global niceties ---------- */
  document.addEventListener('keydown',e=>{
    const t=e.target, typing=t&&/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
    if(e.key==='Escape'){closeQuick();closeSidebar();}
    if(e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey){e.preventDefault();$('globalSearch').focus();}
  });
  window.addEventListener('online',()=>{toast('Back online.');inspectAuth();});
  window.addEventListener('offline',()=>{toast('You are offline.');inspectAuth();});
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&labels[v]&&v!==activeView)navigate(v);});
  // Landing on e.g. /#catalog opens that section once the user is signed in.
  const startView=location.hash.slice(1);
  if(startView && appViews.indexOf(startView)>=0 && startView!=='overview'){ pending.push(()=>{const b=bridge(); if(b&&b.navigate(startView))setNav(startView,true);}); }

  frame.addEventListener('load',onFrameReady);
  frame.addEventListener('error',()=>showLoadError('The workspace file could not be loaded. Reload the page.'));
  setTimeout(onFrameReady,700);
})();
</script>
</body></html>
